name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Checks that the published package resolves correctly for ESM, CJS and every moduleResolution mode.
      - name: Check package types
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          bunx @arethetypeswrong/cli --profile node16 "$RUNNER_TEMP"/hsrcpay-sdk-*.tgz

  pr-title:
    # Squash merges use the PR title as the commit message, and release-please reads it to pick the next version.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
