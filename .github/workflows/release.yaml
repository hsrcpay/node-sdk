name: CI and Release

# main is CI only. A release happens only when a new `v*` tag is pushed (e.g. v1.2.3);
# the package version is taken from the tag and the tag commit must be on main.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a semver version (vMAJOR.MINOR.PATCH[-prerelease])"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # The version lives only in the tag and the published package; main never receives a version commit.
      - name: Apply version
        run: bun -e 'const p=await Bun.file("package.json").json();p.version=process.env.V;await Bun.write("package.json",JSON.stringify(p,null,2)+"\n")'
        env:
          V: ${{ steps.tag.outputs.version }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Publish to npm
        run: |
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            bun publish --access public --tag next
          else
            bun publish --access public
          fi
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: |
          flags=""
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
