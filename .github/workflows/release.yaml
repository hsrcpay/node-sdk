name: CI and Release

# Single branch flow: every push to main is verified and released. The version is derived from
# the latest v* tag and the conventional commits since it (see scripts/next-version.ts).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  release:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Compute version
        id: version
        run: echo "value=$(bun scripts/next-version.ts)" >> "$GITHUB_OUTPUT"

      # The version lives only in the tag and the published package; main never receives a version commit.
      - name: Apply version
        run: bun -e 'const p=await Bun.file("package.json").json();p.version=process.env.V;await Bun.write("package.json",JSON.stringify(p,null,2)+"\n")'
        env:
          V: ${{ steps.version.outputs.value }}

      - run: bun run build

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and GitHub release
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
          gh release create "v${{ steps.version.outputs.value }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
