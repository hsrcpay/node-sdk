name: Unpublish scaffold 0.1.0 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish @hsrcpay/sdk@0.1.0
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          npm unpublish @hsrcpay/sdk@0.1.0 --userconfig "$RUNNER_TEMP/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
